<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поиск</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap"></noscript>
<style>
:root{
  --bg:#f2f1f6; --surface:#ffffff; --surface2:#ebeaf2; --line:#dcdae8;
  --fg:#1b1a26; --muted:#6b6980; --accent:#4a55d6; --accent-fg:#ffffff; --accent-soft:#e4e6fb;
  --mid:#b9851a;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121119; --surface:#1b1a25; --surface2:#242332; --line:#302f42;
  --fg:#eeedf6; --muted:#9a98b0; --accent:#8b97ff; --accent-fg:#14131f; --accent-soft:#2a2d52; --mid:#e0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121119; --surface:#1b1a25; --surface2:#242332; --line:#302f42;
  --fg:#eeedf6; --muted:#9a98b0; --accent:#8b97ff; --accent-fg:#14131f; --accent-soft:#2a2d52; --mid:#e0b04a; color-scheme:dark}
:root[data-theme="crimson"]{
  --bg:#0a0506; --surface:#150b0d; --surface2:#201013; --line:#3a1b20;
  --fg:#f5ebeb; --muted:#b58f93; --accent:#e5384a; --accent-fg:#ffffff; --accent-soft:#3b1519; --mid:#e0b04a; color-scheme:dark}
:root[data-theme="crimson"] body{background:radial-gradient(60% 45% at 85% 0%,rgb(170 22 34 / .38),transparent 70%),radial-gradient(55% 45% at 0% 55%,rgb(110 10 20 / .32),transparent 70%),var(--bg);background-attachment:fixed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto}
/* верхняя строка и строка поиска: те же размеры и место, что на главной */
.proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:12px;min-height:62px;color:var(--muted);font-size:13px}
.proto a{color:var(--muted);text-decoration:none}.proto a:hover{color:var(--fg)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.gs{position:relative;margin:0 0 12px}
.gs-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.gs-box:focus-within{border-color:var(--accent)}
.gs-box svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.gs-box input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;padding:11px 0;outline:0}
.gs-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.gs-chip{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:4px 11px;font-size:13px}
.gs-chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.res{max-width:760px}
.row{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.cv{width:56px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;display:block}
.ph{display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-size:20px}
h4{margin:0 0 2px;font-size:15px;font-weight:500}.m{color:var(--muted);font-size:13px}.d{font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{text-align:center;color:var(--muted);padding:28px 0}.warn{color:var(--mid);font-size:13px;margin-bottom:8px}
.tr{margin:8px 0 0;padding-left:20px;font-size:13px}.tb{border:0;background:none;color:var(--accent);padding:0;font:inherit;font-size:13px;margin-top:4px}
.fine{margin-top:24px;color:var(--muted);font-size:12px}
.row[data-tid]{cursor:pointer}.row[data-tid]:hover{border-color:var(--accent)}h4 a.tl{color:inherit;text-decoration:none}
a{color:var(--accent)}
</style></head><body><div class="wrap">
  <div class="proto">
    <a href="/">← На сайт</a>
  </div>
  <div class="gs">
    <div class="gs-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off" placeholder="Поиск: игры, фильмы, сериалы, аниме, музыка, книги" aria-label="Поиск"></div>
  </div>
  <div class="gs-chips" id="chips" role="group" aria-label="Категория"></div>
  <div class="res">
  <div id="out"></div>
  <p class="fine">Фильмы, сериалы и аниме: This product uses the TMDB API but is not endorsed or certified by TMDB.<br>
Книги: данные и обложки <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>. Музыка: данные <a href="https://musicbrainz.org" target="_blank" rel="noopener">MusicBrainz</a>, обложки Cover Art Archive, а также <a href="https://www.deezer.com" target="_blank" rel="noopener">Deezer</a>. Игры: <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a>.</p>
  </div>
</div>
<script src="/config.js"></script>
<script>
const {SUPABASE_URL, PUBLISHABLE_KEY} = window.APP || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
const KIND = {movie: 'Фильм', series: 'Сериал', anime: 'Аниме', book: 'Книга', music: 'Альбом', game: 'Игра'};

// Превью для списков: все картинки идём через наш сайт (/img/...)
function thumb(u) {
  if (!u) return null;
  if (u.startsWith('https://image.tmdb.org/t/p/')) return u.replace('https://image.tmdb.org/t/p/w500/', '/img/w185/');
  const m = u.match(/covers\.openlibrary\.org\/b\/id\/(\d+)-L\.jpg/);
  if (m) return `/img/ol/M/${m[1]}.jpg`;
  const st = u.match(/steamstatic\.com\/steam\/apps\/(\d+)\/library_600x900/);
  if (st) return `/img/steam/${st[1]}.jpg`;
  const g = u.match(/media\.rawg\.io\/media\/(?:crop\/\d+\/\d+\/)?((?:games|screenshots)\/[0-9a-f]{2,3}\/[0-9a-f]{32}\.jpg)/);
  if (g) return `/img/rawg/420/${g[1]}`;
  const dz = u.match(/cdn-images\.dzcdn\.net\/images\/cover\/([0-9a-f]{32})\//);
  if (dz) return `/img/dz/${dz[1]}/250.jpg`;
  const c = u.match(/coverartarchive\.org\/release-group\/([0-9a-f-]{36})\//);
  if (c) return `/img/caa/${c[1]}/250.jpg`;
  return null;
}

// нет обложки (у части альбомов и книг её нет): рисуем заглушку
function fb(img, ch, h) {
  const d = document.createElement('div');
  d.className = 'cv ph'; d.style.background = `hsl(${h} 45% 42%)`; d.textContent = ch;
  img.replaceWith(d);
}

// треклист альбома по клику
$('out').addEventListener('click', async e => {
  const b = e.target.closest('.tb'); if (!b) return;
  const box = b.nextElementSibling;
  if (box.dataset.done) { box.hidden = !box.hidden; return; }
  b.textContent = 'Загружаю…';
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/search?${/^\d+$/.test(b.dataset.id) ? 'dz' : 'album'}=${encodeURIComponent(b.dataset.id)}`,
      {headers: {apikey: PUBLISHABLE_KEY, Authorization: 'Bearer ' + PUBLISHABLE_KEY}});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    const mm = ms => ms ? ` <span class="m">${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}</span>` : '';
    box.innerHTML = j.tracks.length
      ? '<ol class="tr">' + j.tracks.map(t => `<li>${esc(t.title)}${mm(t.duration_ms)}</li>`).join('') + '</ol>'
      : '<div class="m">Треклист не найден.</div>';
    box.dataset.done = '1'; b.textContent = 'Треки';
  } catch (err) { b.textContent = 'Треки'; box.innerHTML = `<div class="m">Не получилось (${esc(err.message)}).</div>`; }
});

const CATS_OK = ['all','movie','series','anime','book','music','game'];
let CAT = 'all';
function drawChips() {
  const L = {all:'Все',movie:'Фильмы',series:'Сериалы',anime:'Аниме',game:'Игры',music:'Музыка',book:'Книги'};
  $('chips').innerHTML = ['all','game','movie','series','anime','music','book'].map(k => `<button type="button" class="gs-chip" data-k="${k}" aria-pressed="${CAT===k}">${L[k]}</button>`).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; CAT = b.dataset.k; drawChips(); syncUrl(); run(); });
function syncUrl() { try { const u = new URL(location.href); u.searchParams.set('q', $('q').value.trim()); u.searchParams.set('cat', CAT); history.replaceState(null, '', u); } catch (_) {} }
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); syncUrl(); run(); } });
$('q').addEventListener('input', syncUrl);
// тема — та же, что выбрана на сайте
function applyTheme(th) { const r = document.documentElement; if (!th || th === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', th); }
function curTheme() { try { return JSON.parse(localStorage.getItem('prof_settings') || '{}').theme || 'auto'; } catch (_) { return 'auto'; } }
applyTheme(curTheme()); drawChips();
const DEBUG = location.search.includes('debug');
let timer, ctrl;

let LAST = [];
function tid(t) { return t.source + ':' + t.external_id; }
function render(list, warn) {
  LAST = list || [];
  try { localStorage.setItem('search_rows', JSON.stringify(LAST.slice(0, 40).map(t => ({...t, description: (t.description || '').slice(0, 300)})))); } catch (_) {}
  if (!list.length) { $('out').innerHTML = '<div class="st">Ничего не найдено. Проверьте написание или выберите другую категорию.</div>'; return; }
  $('out').innerHTML = (warn ? '<div class="warn">Часть внешних баз сейчас недоступна, показаны найденные результаты.</div>' : '') +
    list.map(t => {
      const src = thumb(t.cover_url);
      const cv = src
        ? `<img class="cv" loading="lazy" alt="" src="${esc(src)}" onerror="fb(this,'${esc(t.title[0])}',${hue(t.title)})">`
        : `<div class="cv ph" style="background:hsl(${hue(t.title)} 45% 42%)">${esc(t.title[0])}</div>`;
      const orig = t.original_title && t.original_title !== t.title ? ` · ${esc(t.original_title)}` : '';
      const who = (t.creators || []).length ? ` · ${esc(t.creators.slice(0, 2).join(', '))}` : '';
      return `<div class="row" data-tid="${esc(tid(t))}">${cv}<div><h4><a class="tl" href="/?t=${encodeURIComponent(tid(t))}">${esc(t.title)}</a></h4>
        <div class="m">${KIND[t.category] || t.category}${t.year ? ' · ' + t.year : ''}${who}${orig}</div>
        <div class="m">${esc((t.genres || []).slice(0, 3).join(', '))}</div>
        <div class="d">${esc(t.description)}</div>
        ${DEBUG?`<div class="m" style="word-break:break-all;color:#e0a030">alt: ${esc((t.alt_titles||[]).join('; ')||'НЕТ')} | cover: ${esc(t.cover_url||'НЕТ')} | src: ${esc(src||'НЕТ')} | steam: ${esc((t.extra&&t.extra.steam_id)||'-')}/${esc((t.extra&&t.extra.steam_checked)||'-')}</div>`:''}
        ${t.category === 'music' ? `<button class="tb" data-id="${esc(t.external_id)}">Треки</button><div></div>` : ''}</div></div>`;
    }).join('');
}

async function run() {
  const q = $('q').value.trim();
  if (ctrl) ctrl.abort();
  if (q.length < 2) { $('out').innerHTML = '<div class="st">Введите хотя бы 2 буквы.</div>'; return; }
  ctrl = new AbortController();
  $('out').innerHTML = '<div class="st">Ищу…</div>';
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/search?q=${encodeURIComponent(q)}&cat=${CAT}`,
      {signal: ctrl.signal, headers: {apikey: PUBLISHABLE_KEY, Authorization: 'Bearer ' + PUBLISHABLE_KEY}});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    render(j.results, j.warning);
  } catch (e) {
    if (e.name === 'AbortError') return;
    $('out').innerHTML = `<div class="st">Не получилось найти (${esc(e.message)}). Попробуйте ещё раз.</div>`;
  }
}
$('out').addEventListener('click', e => {
  if (e.target.closest('.tb,.tr,a')) return;
  const r = e.target.closest('.row[data-tid]'); if (r) location.href = '/?t=' + encodeURIComponent(r.dataset.tid);
});
const deb = () => { clearTimeout(timer); timer = setTimeout(run, 250); };   // debounce 250 мс
$('q').addEventListener('input', deb);
{const p = new URLSearchParams(location.search); if (p.get('q')) { $('q').value = p.get('q'); if (CATS_OK.includes(p.get('cat'))) CAT = p.get('cat'); run(); }}
</script></body></html>
